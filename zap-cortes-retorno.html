<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Zap Cortes - retorno do login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
  body { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; max-width: 560px; margin: 80px auto; padding: 0 20px; color: #1a1a1a; line-height: 1.6; text-align: center; }
  a { color: #0b6bcb; }
</style>
</head>
<body>
  <h1>Zap Cortes</h1>
  <p id="msg">Conectando ao Zap Cortes no seu computador... / Connecting to Zap Cortes on your computer...</p>
  <p id="manual" hidden>Se nada acontecer, o Zap Cortes precisa estar aberto neste computador. / If nothing happens, Zap Cortes must be open on this computer.<br><a id="link" href="#">Continuar / Continue</a></p>
  <noscript><p>Ative o JavaScript para concluir a conexão. / Enable JavaScript to finish connecting.</p></noscript>
  <script>
    // Página estática: repassa o resultado da autorização do TikTok (code, state, error) ao app local do usuário.
    // Não grava nem envia nada para lugar nenhum além do endereço local do próprio usuário.
    var destino = "http://127.0.0.1:8770/api/cortes/tiktok/retorno" + window.location.search;
    document.getElementById("link").href = destino;
    setTimeout(function () { document.getElementById("manual").hidden = false; }, 4000);
    window.location.replace(destino);
  </script>
</body>
</html>
